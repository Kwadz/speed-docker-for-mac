name: Rebuild Symfony 6.4 lockfile (issue 21)
on:
  push:
    branches:
      - fix/issue-21-symfony-6-4-security

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Update Symfony dependencies within the 6.4 LTS constraints
        working-directory: app
        run: composer update 'symfony/*' --with-all-dependencies --no-interaction --no-progress

      - name: Check versions and dependency health
        working-directory: app
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked
          php -r '$lock=json_decode(file_get_contents("composer.lock"),true,512,JSON_THROW_ON_ERROR);foreach($lock["packages"] as $p){if($p["name"]==="symfony/http-foundation"){echo $p["name"]." ".$p["version"].PHP_EOL;if(!str_starts_with($p["version"],"v6.4."))exit(1);exit(0);}}exit(2);'
          APP_ENV=prod APP_SECRET=ci-secret php bin/console cache:clear --env=prod

      - name: Docker Compose functional smoke test
        run: |
          docker compose up -d --build
          docker compose exec -T php-fpm composer install --no-interaction --no-progress
          docker compose exec -T php-fpm php bin/console doctrine:migrations:migrate --no-interaction
          docker compose exec -T php-fpm php bin/console doctrine:fixtures:load --no-interaction
          for i in {1..20}; do
            if curl --fail --silent --show-error http://localhost/ -o /tmp/homepage.html; then
              echo "Symfony homepage is responding successfully"
              break
            fi
            if [ "$i" -eq 20 ]; then exit 1; fi
            sleep 2
          done

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Commit validated composer.lock
        run: |
          if ! git diff --quiet -- app/composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/composer.lock
            git commit -m "Update Symfony 6.4 LTS lockfile (refs #21)"
            git push origin HEAD:fix/issue-21-symfony-6-4-security
          fi
